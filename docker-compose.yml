services:
  server:
    image: registry.steglasaurous.com/requestobot:dev
    build: .
    restart: unless-stopped
    networks:
      - default
      - proxynet
    env_file:
      - .env
    ports:
      - 3000
    volumes:
      - ./twitch_token.json:/usr/src/app/twitch_token.json
      - ./static:/usr/src/app/static

  static:
    image: nginx
    # FIXME: Configure appropriately - use with nginx proxy?
    # alternatively, have this sit in front of node? Might be a lot..  nginx -> nginx -> node
    # it would however allow everything to be served from the same domain, just different path
    volumes:
      # - static-content:/usr/share/nginx/html
      - ./static:/usr/share/nginx/html
    environment:
      VIRTUAL_HOST: requestobot-dev-static.steglasaurous.com
      LETSENCRYPT_HOST: requestobot-dev-static.steglasaurous.com
      LETSENCRYPT_EMAIL: me@steglasaurous.com
    networks:
      - proxynet

  db:
    image: registry.steglasaurous.com/requestobot-db:dev
    build: docker/db
    restart: always
    ports:
      - 5432:5432 # FIXME: Remove for actual deployment
    volumes:
      - requestobot-pgdata:/var/lib/postgresql/data
      - ./dumps:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    networks:
      - default
networks:
  proxynet:
    name: nginx_proxy-tier
    external: true

volumes:
  requestobot-pgdata:
  static-content:

