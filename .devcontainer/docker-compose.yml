services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/requestobot:cached
      - node_modules:/workspaces/requestobot/node_modules
    command: sleep infinity
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ../docker/db
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - requestobot-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  requestobot-pgdata:
  node_modules:
